name: Build

on:
  push:
    # main is built by the Release workflow, which calls this one.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version stamped into Loudify.exe
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build limiter plugin
        run: |
          cmake -S native/LoudifyLimiter -B native/LoudifyLimiter/build -A x64
          cmake --build native/LoudifyLimiter/build --config Release

      - name: Test limiter plugin
        run: ctest --test-dir native/LoudifyLimiter/build -C Release --output-on-failure

      - name: Test core library
        run: dotnet test tests/Loudify.Core.Tests -c Release

      - name: Publish Loudify.exe
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $versionArgs = @()
          if ($env:VERSION) { $versionArgs = @("-p:Version=$env:VERSION") }
          dotnet publish src/Loudify/Loudify.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true @versionArgs -o publish
          if (-not (Test-Path publish/Loudify.exe)) { throw "publish/Loudify.exe was not produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: Loudify-win-x64
          path: publish/Loudify.exe
          if-no-files-found: error
